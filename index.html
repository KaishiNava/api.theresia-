<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theresia API — Modern Dashboard</title>
    <!-- Menggunakan Font Awesome untuk icon bergaya modern -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0c;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== GRID & GLOW BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        /* Decorative Background Orbs */
        .geo-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.12;
        }
        .geo-circle-1 {
            width: 400px;
            height: 400px;
            background: #ffffff;
            top: -100px;
            right: -100px;
        }
        .geo-circle-2 {
            width: 300px;
            height: 300px;
            background: #ffffff;
            bottom: -50px;
            left: -50px;
        }

        /* ===== LAYOUT CONTAINER ===== */
        .app-container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.25rem;
            background: rgba(18, 18, 22, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
        }

        .brand {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .brand span {
            font-weight: 300;
            color: #a1a1aa;
        }

        .api-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.725rem;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        /* ===== TOOL TABS ===== */
        .tool-tabs {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        .tool-tabs::-webkit-scrollbar { display: none; }
        
        .tool-tab {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.825rem;
            font-weight: 600;
            padding: 0.55rem 1rem;
            border-radius: 30px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tool-tab:hover, .tool-tab.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ===== CARDS & UI COMPONENTS ===== */
        .glass-card {
            background: rgba(18, 18, 22, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 1.6rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            margin-bottom: 1.2rem;
            animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #ffffff;
        }

        .endpoint-path {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.7rem;
            color: #a1a1aa;
            background: rgba(0,0,0,0.3);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .sub-text {
            color: #a1a1aa;
            font-size: 0.825rem;
            line-height: 1.5;
            margin-bottom: 1.4rem;
        }

        /* ===== FORM INPUTS ===== */
        .input-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 0.725rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a;
            margin-bottom: 0.5rem;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.4rem;
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.75);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 0.65rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.85rem 1.1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: #ffffff;
            color: #09090b;
            border-color: #ffffff;
        }
        .btn-primary:hover {
            background: #e4e4e7;
            border-color: #e4e4e7;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== STATUS / JSON BOX ===== */
        .status-box {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 14px;
            background: rgba(8, 8, 10, 0.7);
            font-family: 'SFMono-Regular', Consolas, Monaco, monospace;
            font-size: 0.75rem;
            color: #a1a1aa;
            border: 1px solid rgba(255, 255, 255, 0.06);
            line-height: 1.6;
            display: none; /* Hidden by default */
        }
        .status-box.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        .status-box pre {
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-box pre::-webkit-scrollbar {
            width: 6px;
        }
        .status-box pre::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        /* Error state */
        .status-box.error {
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        /* ===== MEDIA RESULT UI ===== */
        .media-result {
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            display: none;
        }
        .media-result.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        .media-preview {
            width: 100%;
            background: #000;
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .media-preview video, .media-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 400px;
        }

        .media-details {
            padding: 1.25rem;
        }
        .media-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .media-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .meta-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #a1a1aa;
            text-transform: uppercase;
        }

        /* Pinterest Grid (For Multiple Results) */
        .pin-grid {
            padding: 1rem;
            columns: 2 150px;
            column-gap: 10px;
        }
        @media (min-width: 600px) { .pin-grid { columns: 3 180px; } }
        .pin-card {
            break-inside: avoid;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            overflow: hidden;
        }
        .pin-card img {
            width: 100%;
            display: block;
        }
        .pin-card-body {
            padding: 0.75rem;
            display: flex;
            gap: 0.5rem;
        }
        .pin-btn {
            flex: 1;
            padding: 0.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.7rem;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }
        .pin-btn:hover { background: rgba(255,255,255,0.1); }

        /* Loader Animation */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        .footer {
            margin-top: auto;
            padding: 2rem 0 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: #52525b;
        }

        @media (max-width: 600px) {
            .glass-card { padding: 1.25rem; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="geo-circle geo-circle-1"></div>
<div class="geo-circle geo-circle-2"></div>

<div class="app-container">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand">Theresia <span>API</span></div>
        <div class="api-badge">
            <span class="status-dot"></span>
            <span>API Online</span>
        </div>
    </nav>

    <!-- TABS NAVIGATOR -->
    <div class="tool-tabs" id="toolTabs">
        <!-- Generated by JS -->
    </div>

    <!-- MAIN CARD -->
    <div class="glass-card">
        <div class="card-header">
            <div class="card-title" id="cardTitle">
                <i class="fa-brands fa-tiktok"></i> TikTok Downloader
            </div>
            <div class="endpoint-path" id="endpointPath">/api/download/tiktok</div>
        </div>
        <p class="sub-text" id="cardDesc">Unduh video TikTok tanpa watermark secara instan.</p>
        
        <form id="apiForm">
            <div class="input-group">
                <label>URL Target</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="text" id="targetUrl" placeholder="https://vt.tiktok.com/..." required autocomplete="off">
                </div>
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="executeBtn">
                    <i class="fa-solid fa-bolt"></i> Execute API
                </button>
            </div>
        </form>

        <!-- ERROR / NOTIF BOX -->
        <div id="errorBox" class="status-box error"></div>

        <!-- MEDIA RESULT BOX -->
        <div id="mediaResult" class="media-result">
            <div class="media-preview" id="mediaPreview">
                <!-- Video / Image injected here -->
            </div>
            <div class="media-details" id="mediaDetails">
                <!-- Details injected here -->
            </div>
        </div>

        <!-- JSON RESPONSE BOX -->
        <div id="jsonResult" class="status-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
                <span style="font-weight:600; color:#fff;">RAW JSON RESPONSE</span>
                <button type="button" id="copyJsonBtn" class="pin-btn" style="padding:0.3rem 0.6rem; border-radius:6px; flex:none;">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
            <pre id="jsonOutput"></pre>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        &copy; 2026 Theresia API &bull; Modern Interface Dashboard
    </footer>
</div>

<script>
    (function() {
        "use strict";

        // ==========================================
        // CONFIGURATION TOOLS
        // ==========================================
        const tools = [
            {
                id: "tiktok",
                name: "TikTok",
                icon: "fa-brands fa-tiktok",
                endpoint: "/api/download/tiktok",
                param: "url",
                desc: "Unduh video TikTok tanpa watermark kualitas HD.",
                placeholder: "https://vt.tiktok.com/..."
            },
            {
                id: "douyin",
                name: "Douyin",
                icon: "fa-solid fa-film",
                endpoint: "/api/download/douyin",
                param: "url",
                desc: "Unduh video dari platform Douyin (TikTok China).",
                placeholder: "https://v.douyin.com/..."
            },
            {
                id: "youtube",
                name: "YouTube",
                icon: "fa-brands fa-youtube",
                endpoint: "/api/download/youtube",
                param: "url",
                desc: "Download video atau audio dari YouTube secara instan.",
                placeholder: "https://youtu.be/..."
            },
            {
                id: "pinterest",
                name: "Pinterest",
                icon: "fa-brands fa-pinterest",
                endpoint: "/api/search/pinterest",
                param: "q",
                desc: "Cari dan dapatkan URL gambar HD dari Pinterest.",
                placeholder: "Contoh: Anime wallpaper, Cyberpunk..."
            }
        ];

        let activeTool = tools[0];
        let lastJsonResponse = null;
        let currentVideoObj = null;

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const toolTabsContainer = document.getElementById("toolTabs");
        const cardTitle = document.getElementById("cardTitle");
        const endpointPath = document.getElementById("endpointPath");
        const cardDesc = document.getElementById("cardDesc");
        const targetUrlInput = document.getElementById("targetUrl");
        
        const apiForm = document.getElementById("apiForm");
        const executeBtn = document.getElementById("executeBtn");
        
        const errorBox = document.getElementById("errorBox");
        const mediaResult = document.getElementById("mediaResult");
        const mediaPreview = document.getElementById("mediaPreview");
        const mediaDetails = document.getElementById("mediaDetails");
        
        const jsonResult = document.getElementById("jsonResult");
        const jsonOutput = document.getElementById("jsonOutput");
        const copyJsonBtn = document.getElementById("copyJsonBtn");

        // ==========================================
        // INITIALIZE TABS
        // ==========================================
        function renderTabs() {
            toolTabsContainer.innerHTML = "";
            tools.forEach(tool => {
                const btn = document.createElement("a");
                btn.className = "tool-tab" + (tool.id === activeTool.id ? " active" : "");
                btn.innerHTML = `<i class="${tool.icon}"></i> ${tool.name}`;
                btn.addEventListener("click", (e) => {
                    e.preventDefault();
                    activeTool = tool;
                    updateUI();
                });
                toolTabsContainer.appendChild(btn);
            });
        }

        function updateUI() {
            // Update Active Tab
            document.querySelectorAll(".tool-tab").forEach(tab => {
                tab.classList.remove("active");
                if (tab.innerText.trim() === activeTool.name) {
                    tab.classList.add("active");
                }
            });

            // Update Card Info
            cardTitle.innerHTML = `<i class="${activeTool.icon}"></i> ${activeTool.name} API`;
            endpointPath.innerText = `${activeTool.endpoint}?${activeTool.param}=...`;
            cardDesc.innerText = activeTool.desc;
            
            // Update Input
            targetUrlInput.placeholder = activeTool.placeholder;
            targetUrlInput.value = "";
            
            // Reset Results
            hideAllResults();
        }

        function hideAllResults() {
            errorBox.classList.remove("active");
            mediaResult.classList.remove("active");
            jsonResult.classList.remove("active");
            
            // Hentikan video jika ada
            if (currentVideoObj) {
                currentVideoObj.pause();
                currentVideoObj.src = "";
                currentVideoObj = null;
            }
        }

        function showError(msg) {
            hideAllResults();
            errorBox.innerText = `⚠️ ${msg}`;
            errorBox.classList.add("active");
        }

        // ==========================================
        // HELPERS
        // ==========================================
        function safeUrl(val) {
            if (!val || typeof val !== "string") return null;
            try {
                const u = new URL(val);
                return ["http:", "https:"].includes(u.protocol) ? u.href : null;
            } catch { return null; }
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ==========================================
        // RENDERERS
        // ==========================================
        function renderVideoResult(data) {
            const d = data.data || data;
            
            // Ekstrak URL
            const videoUrl = safeUrl(d.download_url || d.video_nowm || d.video || d.url);
            const thumbUrl = safeUrl(d.cover || d.thumbnail || d.poster);
            const title = escapeHtml(d.title || d.filename || "Video Result");

            // 1. Render Preview Area
            mediaPreview.innerHTML = "";
            if (videoUrl) {
                const video = document.createElement("video");
                video.controls = true;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                if (thumbUrl) video.poster = thumbUrl;
                video.src = videoUrl;
                
                // Force play
                const attemptPlay = () => {
                    video.muted = true;
                    video.play().catch(()=>{});
                };
                video.addEventListener("loadeddata", attemptPlay);
                
                currentVideoObj = video;
                mediaPreview.appendChild(video);
            } else if (thumbUrl) {
                mediaPreview.innerHTML = `<img src="${thumbUrl}" alt="Thumbnail">`;
            } else {
                mediaPreview.innerHTML = `<div style="color:#a1a1aa; font-size:0.8rem;"><i class="fa-solid fa-video-slash fa-2x"></i><br><br>No Preview Available</div>`;
            }

            // 2. Render Details Area
            const chips = [];
            if (d.status && typeof d.status === 'string') chips.push(d.status);
            if (d.provider) chips.push(d.provider);
            if (d.author?.nickname) chips.push(d.author.nickname);

            mediaDetails.innerHTML = `
                <div class="media-title">${title}</div>
                <div class="media-meta">
                    ${chips.map(c => `<span class="meta-chip">${escapeHtml(c)}</span>`).join("")}
                </div>
                <div class="btn-group" style="margin-top:0;">
                    <button class="btn btn-primary" id="dlBtn" style="border-radius:12px;">
                        <i class="fa-solid fa-download"></i> Direct Download
                    </button>
                    <button class="btn" id="openBtn" style="border-radius:12px; flex:0 0 auto;">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </button>
                </div>
            `;

            mediaResult.classList.add("active");

            // Events
            if (videoUrl) {
                document.getElementById("dlBtn").addEventListener("click", async () => {
                    try {
                        const res = await fetch(videoUrl);
                        const blob = await res.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = blobUrl;
                        a.download = `${activeTool.id}_${Date.now()}.mp4`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        URL.revokeObjectURL(blobUrl);
                    } catch {
                        window.open(videoUrl, "_blank");
                    }
                });
                document.getElementById("openBtn").addEventListener("click", () => {
                    window.open(videoUrl, "_blank");
                });
            } else {
                document.getElementById("dlBtn").disabled = true;
                document.getElementById("openBtn").disabled = true;
            }
        }

        function renderPinterestResult(data) {
            const results = Array.isArray(data.results) ? data.results : (data.data?.results || []);
            
            mediaPreview.style.display = "none"; // Hide single preview
            
            if (results.length === 0) {
                mediaDetails.innerHTML = `<div style="text-align:center; color:#a1a1aa; padding:20px;">Tidak ada hasil gambar ditemukan.</div>`;
                mediaResult.classList.add("active");
                return;
            }

            mediaDetails.innerHTML = `<div class="media-title" style="margin-bottom:0;">Hasil Pencarian: ${results.length} Gambar</div>`;
            
            const grid = document.createElement("div");
            grid.className = "pin-grid";

            results.forEach((item, i) => {
                const imgUrl = safeUrl(item.download_direct_url || item.image_url);
                if (!imgUrl) return;

                const pinUrl = safeUrl(item.pin_url);
                
                grid.innerHTML += `
                    <div class="pin-card">
                        <img src="${escapeHtml(imgUrl)}" alt="Pin" loading="${i < 4 ? 'eager' : 'lazy'}">
                        <div class="pin-card-body">
                            <a href="${escapeHtml(imgUrl)}" target="_blank" download class="pin-btn btn-primary" style="color:#000;">
                                <i class="fa-solid fa-download"></i>
                            </a>
                            ${pinUrl ? `<a href="${escapeHtml(pinUrl)}" target="_blank" class="pin-btn"><i class="fa-solid fa-link"></i></a>` : ''}
                        </div>
                    </div>
                `;
            });

            mediaDetails.appendChild(grid);
            mediaResult.classList.add("active");
        }

        // ==========================================
        // EXECUTE API
        // ==========================================
        apiForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const inputVal = targetUrlInput.value.trim();
            if (!inputVal) return;

            hideAllResults();
            mediaPreview.style.display = "flex"; // Reset display logic for video
            mediaPreview.innerHTML = "";
            mediaDetails.innerHTML = "";

            // UI Loading State
            executeBtn.disabled = true;
            executeBtn.innerHTML = `<span class="spinner"></span> Executing...`;

            const endpointUrl = `${activeTool.endpoint}?${activeTool.param}=${encodeURIComponent(inputVal)}`;

            try {
                const response = await fetch(endpointUrl, {
                    headers: { "Accept": "application/json" }
                });

                const contentType = response.headers.get("content-type") || "";
                let data;

                if (contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    throw new Error(`Invalid response format from server (HTTP ${response.status})`);
                }

                lastJsonResponse = data;

                // Show JSON
                jsonOutput.textContent = JSON.stringify(data, null, 2);
                jsonResult.classList.add("active");

                if (!response.ok || data.status === false) {
                    throw new Error(data.message || data.error || "Gagal memproses permintaan.");
                }

                // Render Media
                if (activeTool.id === "pinterest") {
                    renderPinterestResult(data);
                } else {
                    renderVideoResult(data);
                }

            } catch (err) {
                showError(err.message || "Terjadi kesalahan koneksi.");
            } finally {
                executeBtn.disabled = false;
                executeBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> Execute API`;
            }
        });

        // ==========================================
        // JSON COPY HANDLER
        // ==========================================
        copyJsonBtn.addEventListener("click", async () => {
            if (!lastJsonResponse) return;
            try {
                await navigator.clipboard.writeText(JSON.stringify(lastJsonResponse, null, 2));
                copyJsonBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                copyJsonBtn.classList.add("btn-primary");
                copyJsonBtn.style.color = "#000";
                
                setTimeout(() => {
                    copyJsonBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
                    copyJsonBtn.classList.remove("btn-primary");
                    copyJsonBtn.style.color = "";
                }, 2000);
            } catch (e) {}
        });

        // Handle tab switching visibility for videos
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && currentVideoObj) {
                currentVideoObj.muted = true;
                currentVideoObj.play().catch(()=>{});
            }
        });

        // Initialize
        renderTabs();
        updateUI();

    })();
</script>
</body>
</html>
